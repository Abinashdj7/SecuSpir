# ── Primary datasource ────────────────────────────────────────────────────────
spring.datasource.primary.url=${SPRING_DATASOURCE_PRIMARY_URL:jdbc:mysql://localhost:3306/securebank}
spring.datasource.primary.username=${SPRING_DATASOURCE_PRIMARY_USERNAME:root}
spring.datasource.primary.password=${SPRING_DATASOURCE_PRIMARY_PASSWORD}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Replica datasource ────────────────────────────────────────────────────────
# Falls back to primary URL when no dedicated replica is configured (dev/local).
spring.datasource.replica.url=${SPRING_DATASOURCE_REPLICA_URL:${SPRING_DATASOURCE_PRIMARY_URL:jdbc:mysql://localhost:3306/securebank}}
spring.datasource.replica.username=${SPRING_DATASOURCE_REPLICA_USERNAME:${SPRING_DATASOURCE_PRIMARY_USERNAME:root}}
spring.datasource.replica.password=${SPRING_DATASOURCE_REPLICA_PASSWORD:${SPRING_DATASOURCE_PRIMARY_PASSWORD:}}
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
# Use 'update' only in dev; set SPRING_JPA_HIBERNATE_DDL_AUTO=validate in production
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

server.port=8080

# JWT_SECRET must be a Base64-encoded key of at least 32 bytes — no default, app will not start without it
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
