# H2 in-memory database — replaces MySQL for integration tests.
# Both primary and replica point to the same H2 instance so JPA
# DDL runs once (via primary) and both pools can read the schema.

spring.datasource.primary.url=jdbc:h2:mem:securebank_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.primary.driver-class-name=org.h2.Driver
spring.datasource.primary.username=sa
spring.datasource.primary.password=

spring.datasource.replica.url=jdbc:h2:mem:securebank_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.replica.driver-class-name=org.h2.Driver
spring.datasource.replica.username=sa
spring.datasource.replica.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Self-contained JWT secret — no environment variable required in test runs
# Decodes to "integration-test-jwt-secret-key-for-testing-only" (47 bytes > 32 required)
jwt.secret=aW50ZWdyYXRpb24tdGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5
jwt.expiration=3600000

cors.allowed-origins=http://localhost:4200
