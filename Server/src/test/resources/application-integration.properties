# H2 in-memory database — replaces MySQL for integration tests
spring.datasource.url=jdbc:h2:mem:securebank_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Self-contained JWT secret — no environment variable required in test runs
# Decodes to "integration-test-jwt-secret-key-for-testing-only" (47 bytes > 32 required)
jwt.secret=aW50ZWdyYXRpb24tdGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5
jwt.expiration=3600000

cors.allowed-origins=http://localhost:4200
