# Replication failover tests.
# Both datasources intentionally point to the SAME H2 instance so that:
#   - writes go through the primary HikariCP pool and are visible in H2
#   - reads go through the replica HikariCP pool and see the same data
#   - closing the primary pool leaves the replica pool intact → failover works
# DB_CLOSE_DELAY=-1 keeps H2 alive as long as at least one pool holds a connection.

spring.datasource.primary.url=jdbc:h2:mem:securebank_replication;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.primary.driver-class-name=org.h2.Driver
spring.datasource.primary.username=sa
spring.datasource.primary.password=

spring.datasource.replica.url=jdbc:h2:mem:securebank_replication;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.replica.driver-class-name=org.h2.Driver
spring.datasource.replica.username=sa
spring.datasource.replica.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=aW50ZWdyYXRpb24tdGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5
jwt.expiration=3600000

cors.allowed-origins=http://localhost:4200
