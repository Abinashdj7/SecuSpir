<div class="min-h-screen bg-gray-950">

  <!-- Navbar -->
  <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
          </svg>
        </div>
        <span class="text-white font-bold text-lg">SecureBank</span>
      </div>
      <button (click)="goBack()"
        class="text-sm text-gray-400 hover:text-white transition flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to Dashboard
      </button>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-6 py-8">

    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white">Transactions</h1>
      <p class="text-gray-400 text-sm mt-1">Deposit, withdraw or transfer money</p>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="text-center py-12">
      <div class="w-8 h-8 border-2 border-blue-600 border-t-transparent rounded-full
                  animate-spin mx-auto mb-3"></div>
      <p class="text-gray-400">Loading accounts...</p>
    </div>

    <div *ngIf="!loading">

      <!-- Tabs -->
      <div class="flex bg-gray-900 border border-gray-800 rounded-xl p-1 mb-6">
        <button (click)="setTab('deposit')"
          class="flex-1 py-2 text-sm font-medium rounded-lg transition"
          [ngClass]="activeTab === 'deposit'
            ? 'bg-blue-600 text-white'
            : 'text-gray-400 hover:text-white'">
          💰 Deposit
        </button>
        <button (click)="setTab('withdraw')"
          class="flex-1 py-2 text-sm font-medium rounded-lg transition"
          [ngClass]="activeTab === 'withdraw'
            ? 'bg-blue-600 text-white'
            : 'text-gray-400 hover:text-white'">
          💸 Withdraw
        </button>
        <button (click)="setTab('transfer')"
          class="flex-1 py-2 text-sm font-medium rounded-lg transition"
          [ngClass]="activeTab === 'transfer'
            ? 'bg-blue-600 text-white'
            : 'text-gray-400 hover:text-white'">
          🔁 Transfer
        </button>
      </div>

      <!-- Success -->
      <div *ngIf="success"
        class="bg-green-500/10 border border-green-500/30 text-green-400
               text-sm rounded-xl px-4 py-3 mb-4">
        ✅ {{ success }}
      </div>

      <!-- Error -->
      <div *ngIf="error"
        class="bg-red-500/10 border border-red-500/30 text-red-400
               text-sm rounded-xl px-4 py-3 mb-4">
        ❌ {{ error }}
      </div>

      <!-- DEPOSIT FORM -->
      <div *ngIf="activeTab === 'deposit'"
        class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
        <h2 class="text-white font-semibold text-lg mb-5">Deposit Money</h2>
        <form [formGroup]="depositForm" (ngSubmit)="onDeposit()" class="space-y-4">

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">Account</label>
            <select formControlName="accountId"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg
                     px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
              <option value="">Select an account</option>
              <option *ngFor="let acc of accounts" [value]="acc.id">
                {{ acc.accountType }} — {{ acc.accountNumber }} (€{{ acc.balance | number:'1.2-2' }})
              </option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">Amount (€)</label>
            <input formControlName="amount" type="number" min="0.01" step="0.01" placeholder="0.00"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">
              Description <span class="text-gray-500">(optional)</span>
            </label>
            <input formControlName="description" type="text" placeholder="e.g. Salary"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
          </div>

          <button type="submit" [disabled]="submitting || depositForm.invalid"
            class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-50
                   disabled:cursor-not-allowed text-white font-semibold py-2.5
                   rounded-lg transition">
            {{ submitting ? 'Processing...' : 'Deposit' }}
          </button>
        </form>
      </div>

      <!-- WITHDRAW FORM -->
      <div *ngIf="activeTab === 'withdraw'"
        class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
        <h2 class="text-white font-semibold text-lg mb-5">Withdraw Money</h2>
        <form [formGroup]="withdrawForm" (ngSubmit)="onWithdraw()" class="space-y-4">

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">Account</label>
            <select formControlName="accountId"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg
                     px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
              <option value="">Select an account</option>
              <option *ngFor="let acc of accounts" [value]="acc.id">
                {{ acc.accountType }} — {{ acc.accountNumber }} (€{{ acc.balance | number:'1.2-2' }})
              </option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">Amount (€)</label>
            <input formControlName="amount" type="number" min="0.01" step="0.01" placeholder="0.00"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">
              Description <span class="text-gray-500">(optional)</span>
            </label>
            <input formControlName="description" type="text" placeholder="e.g. ATM withdrawal"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
          </div>

          <button type="submit" [disabled]="submitting || withdrawForm.invalid"
            class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50
                   disabled:cursor-not-allowed text-white font-semibold py-2.5
                   rounded-lg transition">
            {{ submitting ? 'Processing...' : 'Withdraw' }}
          </button>
        </form>
      </div>

      <!-- TRANSFER FORM -->
      <div *ngIf="activeTab === 'transfer'"
        class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
        <h2 class="text-white font-semibold text-lg mb-5">Transfer Money</h2>
        <form [formGroup]="transferForm" (ngSubmit)="onTransfer()" class="space-y-4">

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">From Account</label>
            <select formControlName="accountId"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg
                     px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
              <option value="">Select an account</option>
              <option *ngFor="let acc of accounts" [value]="acc.id">
                {{ acc.accountType }} — {{ acc.accountNumber }} (€{{ acc.balance | number:'1.2-2' }})
              </option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">
              Receiver Account Number
            </label>
            <input formControlName="receiverAccountNumber" type="text"
              placeholder="e.g. A1B2C3D4E5F6G7H8"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500
                     transition font-mono"/>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">Amount (€)</label>
            <input formControlName="amount" type="number" min="0.01" step="0.01" placeholder="0.00"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">
              Description <span class="text-gray-500">(optional)</span>
            </label>
            <input formControlName="description" type="text" placeholder="e.g. Rent payment"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
          </div>

          <button type="submit" [disabled]="submitting || transferForm.invalid"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50
                   disabled:cursor-not-allowed text-white font-semibold py-2.5
                   rounded-lg transition">
            {{ submitting ? 'Processing...' : 'Transfer' }}
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
