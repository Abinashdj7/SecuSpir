<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">SecureBank</h1>
      <p class="text-gray-400 mt-1">Create your account</p>
    </div>

    <!-- Card -->
    <div class="bg-gray-900 rounded-2xl p-8 shadow-xl border border-gray-800">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Error -->
        <div *ngIf="error" data-cy="error-message" class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg px-4 py-3">
          {{ error }}
        </div>

        <!-- First & Last Name -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">First name</label>
            <input
              data-cy="first-name-input"
              formControlName="firstName"
              type="text"
              placeholder="John"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500
                     focus:border-transparent transition"/>
            <p *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid"
               class="text-red-400 text-xs mt-1">Required</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">Last name</label>
            <input
              data-cy="last-name-input"
              formControlName="lastName"
              type="text"
              placeholder="Doe"
              class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                     rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500
                     focus:border-transparent transition"/>
            <p *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid"
               class="text-red-400 text-xs mt-1">Required</p>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
          <input
            data-cy="email-input"
            formControlName="email"
            type="email"
            placeholder="john@example.com"
            class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                   rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:border-transparent transition"/>
          <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
             class="text-red-400 text-xs mt-1">Please enter a valid email</p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
          <input
            data-cy="password-input"
            formControlName="password"
            type="password"
            placeholder="••••••••"
            class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500
                   rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:border-transparent transition"/>
          <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
             class="text-red-400 text-xs mt-1">Minimum 8 characters</p>
        </div>

        <!-- Submit -->
        <button
          data-cy="submit-btn"
          type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
                 text-white font-semibold py-2.5 rounded-lg transition duration-200">
          {{ loading ? 'Creating account...' : 'Create account' }}
        </button>

      </form>

      <!-- Login link -->
      <p class="text-center text-gray-400 text-sm mt-6">
        Already have an account?
        <a routerLink="/login" class="text-blue-400 hover:text-blue-300 font-medium transition">
          Sign in
        </a>
      </p>
    </div>

  </div>
</div>
