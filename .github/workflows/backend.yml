name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Server/**'
      - '.github/workflows/backend.yml'

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        working-directory: Server

      - name: Run unit tests
        run: |
          ./mvnw test \
            -Dtest="!*IntegrationTest,!SecurebankApplicationTests" \
            -Dsurefire.failIfNoSpecifiedTests=false
        working-directory: Server

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: Server/target/surefire-reports/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        working-directory: Server

      - name: Run integration tests
        run: |
          ./mvnw test \
            -Dtest="*IntegrationTest,SecurebankApplicationTests" \
            -Dsurefire.failIfNoSpecifiedTests=false
        working-directory: Server

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: Server/target/surefire-reports/
          retention-days: 7

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        working-directory: Server

      - name: Build JAR
        run: ./mvnw package -DskipTests
        working-directory: Server

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: securebank-backend
          path: Server/target/*.jar
          retention-days: 7
