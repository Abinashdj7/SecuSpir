name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Server/**'

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: ./mvnw test
        working-directory: Server

      - name: Build JAR
        run: ./mvnw package -DskipTests
        working-directory: Server

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: securebank-backend
          path: Server/target/*.jar
          retention-days: 7
