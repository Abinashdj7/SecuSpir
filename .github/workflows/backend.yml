name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Server/**'

jobs:

  # ── Unit & slice tests (Mockito + @WebMvcTest) ──────────────────────────────
  # No Spring datasource or JWT secret needed — these tests never load the full
  # application context.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        working-directory: Server

      - name: Run unit and slice tests
        run: |
          ./mvnw test \
            -Dtest="!*IntegrationTest,!SecurebankApplicationTests" \
            -Dsurefire.failIfNoSpecifiedTests=false
        working-directory: Server

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: Server/target/surefire-reports/
          retention-days: 7

  # ── Integration tests (@SpringBootTest + H2) ────────────────────────────────
  # Use the "integration" profile which provides a self-contained H2 datasource
  # and JWT secret — no repository secrets required.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        working-directory: Server

      - name: Run integration tests
        run: |
          ./mvnw test \
            -Dtest="*IntegrationTest,SecurebankApplicationTests" \
            -Dsurefire.failIfNoSpecifiedTests=false
        working-directory: Server

      - name: Upload integration test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: Server/target/surefire-reports/
          retention-days: 7

  # ── Build JAR (only after all tests pass) ───────────────────────────────────
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        working-directory: Server

      - name: Build JAR
        run: ./mvnw package -DskipTests
        working-directory: Server
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: securebank-backend
          path: Server/target/*.jar
          retention-days: 7
