name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'Client/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Client/**'
      - '.github/workflows/frontend.yml'

env:
  WORKING_DIR: Client/securebank-frontend

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run unit tests
        run: npm test
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build Angular app
        run: npm run build
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: securebank-frontend
          path: ${{ env.WORKING_DIR }}/dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, build]

    steps:
      - uses: actions/checkout@v4

      - name: Run Cypress e2e tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ${{ env.WORKING_DIR }}
          start: npm start
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
          browser: chrome

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ${{ env.WORKING_DIR }}/cypress/screenshots/
          retention-days: 7
