name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'Client/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Client/**'

jobs:

  # ── Unit tests (Vitest) ─────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Client/securebank-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Client/securebank-frontend

      - name: Run unit tests
        run: npm test
        working-directory: Client/securebank-frontend
        env:
          CI: true

  # ── Production build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Client/securebank-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Client/securebank-frontend

      - name: Build Angular app
        run: npm run build
        working-directory: Client/securebank-frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: securebank-frontend
          path: Client/securebank-frontend/dist/
          retention-days: 7

  # ── Cypress e2e tests (only after unit tests and build both pass) ────────────
  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [unit-tests, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Cypress e2e tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: Client/securebank-frontend
          start: npm start
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
          browser: chrome

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: Client/securebank-frontend/cypress/screenshots/
          retention-days: 7
