name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'Client/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Client/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Client/securebank-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Client/securebank-frontend

      - name: Build Angular app
        run: npm run build
        working-directory: Client/securebank-frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: securebank-frontend
          path: Client/securebank-frontend/dist/
          retention-days: 7
