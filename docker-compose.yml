version: '3.8'

services:

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: securebank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: securebank
    ports:
      - "3307:3306"  # 3307 on host to avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: securebank-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/securebank
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy

  # Angular Frontend
  frontend:
    build:
      context: ./Client/securebank-frontend
      dockerfile: Dockerfile
    container_name: securebank-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data: